<script>
document.addEventListener('DOMContentLoaded', () => {
    const scrollArea = document.getElementById('scroll-area');
    const chatThread = document.getElementById('chat-thread');
    const topics     = document.getElementById('suggested-topics');
    const input      = document.getElementById('chat-input');
    const sendBtn    = document.getElementById('send-btn');

    let currentES = null;

    function esc(t) {
        return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function md(text) {
        let h = esc(text);
        h = h.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        h = h.replace(/\n/g, '<br>');
        return h;
    }

    function scrollBottom() {
        scrollArea.scrollTop = scrollArea.scrollHeight;
    }

    function addUser(text) {
        const el = document.createElement('div');
        el.className = 'flex justify-end w-full';
        el.innerHTML =
            '<div class="max-w-[80%] bg-surface-strong px-lg py-md rounded-2xl rounded-tr-sm border border-hairline-strong">' +
            '<p class="font-body-md text-body-md text-on-surface">' + esc(text) + '</p></div>';
        chatThread.appendChild(el);
        scrollBottom();
    }

    function addBot(html) {
        const row = document.createElement('div');
        row.className = 'flex gap-md w-full';
        row.innerHTML =
            '<div class="w-8 h-8 rounded-full bg-primary-container text-on-primary flex items-center justify-center shrink-0 shadow-sm">' +
            '<span class="material-symbols-outlined text-[18px]">school</span></div>' +
            '<div class="flex-1 max-w-[85%]">' +
            '<div class="prose prose-sm max-w-none text-on-surface font-body-md text-body-md leading-relaxed bot-msg">' +
            html + '</div></div>';
        chatThread.appendChild(row);
        scrollBottom();
        return row.querySelector('.bot-msg');
    }

    // ── initial welcome ──────────────────────────────────────────────────────
    addBot('안녕하세요! 충남대학교 AI 챗봇입니다.<br> 궁금한 것을 물어보세요.');

    // ── send message ─────────────────────────────────────────────────────────
    function send(question) {
        question = question.trim();
        if (!question) return;

        if (currentES) { currentES.close(); currentES = null; }
        input.value = '';
        input.style.height = 'auto';
        sendBtn.disabled = true;
        sendBtn.classList.add('opacity-40', 'cursor-not-allowed');

        addUser(question);
        const loadingHTML =
            '<span class="generating-dots text-secondary text-body-sm">' +
            '답변 생성 중<span>.</span><span>.</span><span>.</span></span>';
        const content = addBot(loadingHTML);

        let full = '';
        const url = '/api/chat?question=' + encodeURIComponent(question);
        currentES = new EventSource(url);

        currentES.onmessage = function(e) {
            const data = JSON.parse(e.data);
            if (data.done) {
                currentES.close(); currentES = null;
                sendBtn.disabled = false;
                sendBtn.classList.remove('opacity-40', 'cursor-not-allowed');
                content.innerHTML = full ? md(full) : '죄송합니다. 응답을 받지 못했습니다.';
                scrollBottom();
                return;
            }
            full += data.token;
            content.innerHTML = md(full) + '<span class="opacity-40">▍</span>';
            scrollBottom();
        };

        currentES.onerror = function() {
            if (currentES) { currentES.close(); currentES = null; }
            sendBtn.disabled = false;
            sendBtn.classList.remove('opacity-40', 'cursor-not-allowed');
            content.innerHTML = full ? md(full) : '응답을 가져오는 중 오류가 발생했습니다.';
            scrollBottom();
        };
    }

    // ── event listeners ──────────────────────────────────────────────────────
    sendBtn.addEventListener('click', function() { send(input.value); });

    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(input.value); }
    });

    input.addEventListener('input', function() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    });

    document.getElementById('btn-calendar').addEventListener('click', function() {
        send('가장 가까운 학사일정 알려주세요.');
    });
    document.getElementById('btn-graduation').addEventListener('click', function() {
        send('졸업하려면 몇 학점 필요한가요?');
    });
    document.getElementById('btn-shuttle').addEventListener('click', function() {
        send('셔틀버스 시간표와 노선 알려주세요.');
    });
});
</script>
